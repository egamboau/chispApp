services:
  tournament:
    image: ${TOURNAMENT_IMAGE:-tournament-display:latest}
    environment:
      PORT: 3000
      DATABASE_PATH: /data/tournament.db
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
    volumes:
      - type: bind
        source: ${TOURNAMENT_DATA_DIR:?Set TOURNAMENT_DATA_DIR}
        target: /data
    networks:
      - public-ingress
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.id == ${TOURNAMENT_NODE_ID:?Set TOURNAMENT_NODE_ID}
      restart_policy:
        condition: on-failure

networks:
  public-ingress:
    external: true
