services:
  tournament:
    image: ${TOURNAMENT_IMAGE:-tournament-display:latest}
    environment:
      PORT: 3000
      DATABASE_PATH: /data/tournament.db
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
    volumes:
      - tournament-data:/data
    networks:
      - public-ingress
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  tournament-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER},rw,nfsvers=4
      device: :${NFS_EXPORT}

networks:
  public-ingress:
    external: true
