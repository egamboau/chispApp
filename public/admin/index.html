<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torneos | Administración</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-page="tournaments">
  <header><h1>Administración</h1><nav aria-label="Administración"><a class="active" href="/admin/">Torneos</a><a href="/admin/teams.html">Equipos</a><a href="/admin/calendar.html">Calendario</a><a href="/display" target="_blank">Pantalla pública</a></nav></header>
  <main class="management-layout">
    <section class="panel">
      <h2>Torneos</h2>
      <form id="tournament-form" class="compact-form">
        <label>Nuevo torneo<input id="tournament-name" maxlength="100" required></label>
        <button class="primary">CREAR TORNEO</button>
      </form>
      <p id="message" role="alert"></p>
      <label>Seleccionar torneo<select id="admin-tournament"></select></label>
      <div id="tournament-detail" aria-live="polite"></div>
    </section>

    <section class="panel">
      <h2>Fases</h2>
      <form id="phase-form" class="compact-form">
        <label>Nombre<input id="phase-name" maxlength="100" required></label>
        <label>Tipo<select id="phase-type"><option value="TABLE">Tabla</option><option value="ELIMINATION">Eliminatoria</option></select></label>
        <button class="primary">CREAR FASE</button>
      </form>
      <label>Seleccionar fase<select id="admin-phase"></select></label>
      <div id="phase-detail" aria-live="polite"></div>

      <h3>Grupos de esta fase</h3>
      <form id="group-form" class="compact-form"><label>Nombre del grupo<input id="group-name" maxlength="100" required></label><button class="primary">AÑADIR GRUPO</button></form>
      <div id="groups" aria-live="polite"></div>

      <h3>Rangos de clasificación</h3>
      <form id="rule-form" class="compact-form">
        <label>Desde<input id="rule-start" type="number" min="1" required></label>
        <label>Hasta<input id="rule-end" type="number" min="1" required></label>
        <label>Destino<input id="rule-label" maxlength="100" required></label>
        <button class="primary">AÑADIR RANGO</button>
      </form>
      <div id="rules" aria-live="polite"></div>
    </section>
  </main>
  <script src="/admin/admin.js"></script>
</body>
</html>
