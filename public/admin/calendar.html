<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario | Administración</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-page="calendar">
  <header><h1>Administración</h1><nav aria-label="Administración"><a href="/admin/">Torneos</a><a href="/admin/teams.html">Equipos</a><a class="active" href="/admin/calendar.html">Calendario</a><a href="/display" target="_blank">Pantalla pública</a></nav></header>
  <main>
    <section class="panel form-panel">
      <h2>Agregar partido</h2>
      <label>Torneo<select id="admin-tournament"></select></label>
      <p>Fase actual: <strong id="current-phase">Sin fase actual</strong></p>
      <form id="match-form">
        <input type="hidden" id="match-id">
        <label>Grupo del equipo A<select id="groupId" required></select></label>
        <label>Fecha<input id="date" type="date" required></label>
        <label>Jornada<select id="jornada" required><option value="MORNING">Mañana</option><option value="AFTERNOON">Tarde</option></select></label>
        <label>Cancha<input id="court" type="number" min="1" step="1" inputmode="numeric" required></label>
        <label>Equipo A<select id="teamAId" required></select></label>
        <label>Equipo B<select id="teamBId" required></select></label>
        <label>Equipo de línea<select id="lineTeamId" required></select></label>
        <div class="form-actions"><button class="primary" type="submit">GUARDAR PARTIDO</button><button id="cancel-edit" type="button" hidden>CANCELAR</button></div>
      </form>
      <p id="message" role="alert"></p>
    </section>

    <section class="matches-section">
      <div class="list-heading">
        <h2>Partidos de la fase actual</h2>
        <div class="filters">
          <label>Fecha<input id="filter-date" type="date"></label>
          <label>Cancha<input id="filter-court" type="number" min="1" inputmode="numeric" placeholder="Todas"></label>
        </div>
      </div>
      <div id="matches" aria-live="polite"></div>
    </section>
  </main>
  <script src="/admin/admin.js"></script>
</body>
</html>
