<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Torneo</title>
  <link rel="stylesheet" href="/display/display.css">
</head>
<body>
  <header>
    <h1>TORNEO</h1>
    <nav aria-label="Vistas del torneo">
      <button class="active" data-view="live">EN JUEGO</button>
      <button data-view="upcoming">PRÓXIMOS</button>
      <button data-view="calendar">CALENDARIO</button>
      <button data-view="results">RESULTADOS</button>
    </nav>
  </header>
  <main>
    <section id="live" class="view active" aria-live="polite"></section>
    <section id="upcoming" class="view" aria-live="polite"></section>
    <section id="calendar" class="view" aria-live="polite">
      <div class="filters" role="group" aria-label="Filtrar calendario">
        <button class="active" data-filter="ALL">TODOS</button>
        <button data-filter="MALE">MASCULINO</button>
        <button data-filter="FEMALE">FEMENINO</button>
      </div>
      <div id="calendar-list"></div>
    </section>
    <section id="results" class="view" aria-live="polite"></section>
  </main>
  <div id="connection" role="status"></div>
  <script src="/display/display.js"></script>
</body>
</html>
