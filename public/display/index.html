<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ChispApp</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/display/display.css">
</head>
<body>
  <header>
    <div class="brand"><h1>ChispApp</h1><p>Datos proporcionados por Chisperos</p></div>
    <div class="selectors">
      <label>Torneo<select id="tournament-select" aria-label="Torneo activo"></select></label>
      <label>Fase<select id="phase-select" aria-label="Fase"></select></label>
    </div>
    <nav aria-label="Vistas del torneo">
      <button class="active" data-view="live">EN JUEGO</button>
      <button data-view="calendar">CALENDARIO</button>
      <button data-view="results">RESULTADOS</button>
      <button data-view="standings">TABLA</button>
    </nav>
  </header>
  <main>
    <section id="live" class="view active" aria-live="polite"></section>
    <section id="calendar" class="view" aria-live="polite">
      <div class="filters" role="group" aria-label="Filtrar calendario">
        <button class="active" data-filter="ALL">TODOS</button>
        <button data-filter="MALE">MASCULINO</button>
        <button data-filter="FEMALE">FEMENINO</button>
      </div>
      <div id="calendar-list"></div>
    </section>
    <section id="results" class="view" aria-live="polite"></section>
    <section id="standings" class="view" aria-live="polite"></section>
  </main>
  <footer>
    <p>La información mostrada es de carácter informativo. Los datos oficiales son los publicados por la Asociación Deportiva de Jupas.</p>
    <p>© 2026 Eduardo Gamboa.</p>
  </footer>
  <div id="connection" role="status"></div>
  <script src="/display/display.js"></script>
</body>
</html>
