services:
  tournament:
    build: .
    image: ${TOURNAMENT_IMAGE:-tournament-display:latest}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_PATH: /data/tournament.db
    volumes:
      - tournament-data:/data
    restart: unless-stopped

  backup:
    build: ./backup
    image: ${BACKUP_IMAGE:-tournament-backup:latest}
    profiles: [tools]
    volumes:
      - tournament-data:/data:ro
      - ${RCLONE_CONFIG_PATH:-./rclone.conf}:/run/secrets/rclone.conf:ro

volumes:
  tournament-data:
